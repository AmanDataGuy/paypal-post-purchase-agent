# render.yaml - Render Blueprint: the Next.js web service plus its Postgres database
#
# - Render > New > Blueprint > pick this repo. Secrets marked `sync: false` are asked for once in the Render dashboard
#   and never live in git.
# - Paid plans on purpose: the free web service sleeps after 15 idle minutes, and free Postgres is deleted after
#   30 days; the demo must stay up for judging until Dec 21, 2026.
services:
  - type: web
    name: paypal-post-purchase-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: paypal-agent-db
          property: connectionString
      - key: LLM_CHAIN
        value: gemini:gemini-3.6-flash,gemini:gemini-3.5-flash-lite
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CONSOLE_PASSCODE
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

databases:
  - name: paypal-agent-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
